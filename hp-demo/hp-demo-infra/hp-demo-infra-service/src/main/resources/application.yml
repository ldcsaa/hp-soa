# app
hp.soa.web:
  app:
    id: "0010100002"
    name: ${project.artifactId}
    version: ${project.version}
    organization: HP-Socket
    owner: Kingfisher
  component-scan:
    base-package: com.github.hpsocket.demo
  access-verification:
    enabled: false
    DefaultAccessPolicy: maybe_login

# logging
#logging.config: classpath:log4j2-kafka.xml

nacos.config:
  server-addr: 1111111
  auto-refresh: true
  remote-first: true
  namespace: DEV
  group: DEMO_GROUP
  data-id: hp-demo-infra-service.yml
  type: yaml
  ext-config:
    - group: GLOBAL_GROUP
      data-id: spring.yml
      type: yaml
      refresh: true
    - group: GLOBAL_GROUP
      data-id: dubbo.yml
      type: yaml
      refresh: true
  bootstrap:
    enable: true
    log-enable: true

# dubbo
dubbo.protocols.tri.port: 6002

# server
server.port: 9002
