# app
hp.soa.web:
  app:
    id: "0010100102"
    name: ${project.artifactId}
    version: ${project.version}
    organization: HP-Socket
    owner: Kingfisher
  component-scan:
    base-package: ${project.groupId}
  access-verification:
    enabled: true
    default-access-policy: maybe_login

# logging
logging.config: classpath:log4j2-kafka.xml

spring.cloud.nacos.config:
  #server-addr: 192.168.56.23:8848
  #username: nacos
  #password: 123456
  #namespace: DEV
  group: DEMO_GROUP
  name: ${hp.soa.web.app.name}
  file-extension: yml
  refresh-enabled: true
  shared-configs:
    - group: GLOBAL_GROUP
      data-id: hp-soa-web.yml
      refresh: true
    - group: GLOBAL_GROUP
      data-id: spring-boot.yml
      refresh: true
    - group: GLOBAL_GROUP
      data-id: dubbo.yml
      refresh: true

# dubbo
dubbo.protocols:
  #dubbo:
  #  name: dubbo
  #  port: 5102
  tri:
    name: tri
    port: 6102

# server
server.port: 9102

## mqtt 配置
# 完整配置可参考以下配置类：
# com.juanvision.mqtt.client.properties.MqttOptions
# org.eclipse.paho.mqttv5.client.MqttConnectionOptions
mqtt:
  # 客户端ID，必须全局唯一（默认：空，随机生成）
  # 支持占位符：%A - 本机IP地址，%P - 当前进程ID，%R - 随机字符串
  clientId: ${hp.soa.web.app.name}_%A
  # 命令操作最大等待时间（单位：毫秒，默认：-1，一直等待）
  timeToWait: -1
  # 手工握手（默认：false）
  manualAcks: false
  
  # TCP 协议服务地址
  #serverURIs: tcp://192.168.56.23:1883
  # SSL 协议服务地址
  serverURIs: ssl://192.168.56.23:8883
  # WS 协议服务地址
  #serverURIs: ws://192.168.56.23:8083
  # WSS 协议服务地址
  #serverURIs: wss://192.168.56.23:8084

  userName: bruce
  # 密码为 byte[] 类型，可以写成以下两种形式
  password: 123456
  #password: !!binary MTIzNDU2

  # 自动重连（默认：false）
  automaticReconnect: true
  # 自动清除会话（默认：true）
  # 注意：共享订阅需要设置自动清除会话
  # 参考：https://www.emqx.io/docs/zh/latest/messaging/mqtt-shared-subscription.html
  cleanStart: true
  # 会话保持时间（单位：秒，cleanStart 为 false 时生效）
  sessionExpiryInterval: 10800
  
  # 遗嘱消息，参考：https://www.emqx.io/docs/zh/latest/messaging/mqtt-will-message.html
  # 注意：客户端异常断线才会发送遗嘱消息；不配置遗嘱消息则不会发送。
  # 遗嘱消息发送主题
  willDestination: testtopic-1
  # 遗嘱消息属性和内容
  willMessage:
    qos: 0
    retained: false
    payload: "app-server disconnected !"
  
  # 消息发布默认配置（发布消息时不指定 qos 或 retained 则用默认值）
  publish:
    defaultQos: 1  # 默认：1
    defaultRetained: false  # 默认：false
    
  # 消息订阅配置
  # 参考文档：
  # https://www.emqx.io/docs/zh/latest/dashboard/subscriptions/subscriptions.html
  # 配置类：
  # org.eclipse.paho.mqttv5.common.MqttSubscription
  # com.juanvision.mqtt.client.properties.MqttOptions.SubscribeOptions
  #
  # 注意：服务应用通常是多实例部署，因此需要配置共享订阅
  # 共享订阅文档：https://www.emqx.io/docs/zh/latest/messaging/mqtt-shared-subscription.html
  subscribes:
    - topic: $share/srv/topicx
      qos: 0
      noLocal: false  # 注意：共享订阅，noLocal 不能设置为 true
      retainAsPublished: false
      retainHandling: 0
    - topic: $share/srv/testtopic-1
      qos: 1
      #noLocal: true  # 注意：共享订阅，noLocal 不能设置为 true
      retainAsPublished: true
      retainHandling: 1
    - topic: $share/srv/testtopic-2
      qos: 2
      #noLocal: false  # 注意：共享订阅，noLocal 不能设置为 true
      retainAsPublished: true
      retainHandling: 2
    - topic: $share/srv/testtopic-3

  # HTTPS/SSL 检验服务端主机地址（默认：true）
  # 注意：生产环境应该设置为 true
  httpsHostnameVerificationEnabled: false
  
  # SSL 证书配置
  # 1. 当 sslCaCertPath 为空时，不加载 SSL 证书
  # 2. 当 sslCaCertPath 不为空，sslClientCertPath或sslClientKeyPath 为空时，执行单向验证
  # 3. 当 sslCaCertPath ，sslClientCertPath，sslClientKeyPath 都不为空时，执行双向验证
  # 根证书
  sslCaCertPath: D:/MyWork/Linux/emqx/certs/cacert.pem
  # 客户端证书
  sslClientCertPath: D:/MyWork/Linux/emqx/certs/client-cert.pem
  # 客户端证书 key 文件
  sslClientKeyPath: D:/MyWork/Linux/emqx/certs/client-key.pem
  # 客户端证书 key 文件密码
  sslKeyPassword: 
