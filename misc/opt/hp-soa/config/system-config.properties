### log4j config

## log4j config file (default: classpath:log4j2.xml)
#logging.config=classpath:log4j2-kafka.xml

log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
log4j2.asyncQueueFullPolicy=Discard
log4j2.discardThreshold=ERROR
log4j2.asyncLoggerConfigRingBufferSize=131072
log4j2.garbagefreeThreadContextMap=true
log4j2.isThreadContextMapInheritable=true
log4j.layout.jsonTemplate.locationInfoEnabled=true

log4j.include.location=true
log4j.logType=hp-soa
log4j.log.level=DEBUG
log4j.logfile.path=/data/logs/access
log4j.logfile.max-size=100 MB
log4j.logfile.max-count=10
log4j.logfile.immediateFlush=false
log4j.logfile.serviceLogFileName=service
log4j.logfile.monitorLogFileName=monitor

## log4j kafka appender config

log4j.kafka.bootstrap.servers=192.168.56.23:9092
log4j.kafka.sasl.jaas.config=
log4j.kafka.syncSend=true
log4j.kafka.max.block.ms=5000
log4j.kafka.topic=hp-soa
log4j.kafka.logType=hp-soa

## log4j gelf appender config

# redis (see: https://logging.paluch.biz/redis.html)
#log4j.gelf.host=redis://192.168.56.23:6379/0#hp-soa
# kafka (see: https://logging.paluch.biz/kafka.html)
log4j.gelf.host=kafka://192.168.56.23:9092#hp-soa
log4j.gelf.port=
log4j.gelf.logType=hp-soa
log4j.gelf.maxMsgSize=8192

## nacos log config
JM.LOG.PATH=/data/logs
com.alibaba.nacos.naming.log.level=warn
com.alibaba.nacos.config.log.level=warn
com.alibaba.nacos.remote.log.level=warn

## sentinel log config
csp.sentinel.log.level=WARNING
csp.sentinel.log.dir=/data/logs/csp
EAGLEEYE.LOG.PATH=/data/logs/eagleeye