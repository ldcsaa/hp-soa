spring.cloud.openfeign:
  client:
    config:
      default:
        # 连接超时时间
        connect-timeout: 3000
        # 读超时时间
        read-timeout: 5000
        # 日志级别（可选值：NONE、BASIC、HEADERS、FULL）
        logger-level: FULL
    compression:
      request:
        # 开启请求压缩支持
        enabled: true
        # 压缩支持的 MIME TYPE
        mime-types: text/xml,application/xml,text/json,application/json
        # 压缩数据大小的下限
        min-request-size: 4096
      response:
        # 开启响应压缩支持
        enabled: true
