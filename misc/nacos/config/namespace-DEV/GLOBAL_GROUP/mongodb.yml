## MongoDB 配置
spring:
  data.mongodb:
    # 完整配置参数参考：org.springframework.boot.autoconfigure.mongo.MongoProperties
    # MongoDB 服务地址，多个地址用','分隔
    uri: mongodb://demo:123456@192.168.56.23:27017/demo
  # spring-boot 4.0+
  mongodb:
    # 完整配置参数参考：org.springframework.boot.mongodb.autoconfigure
    uri: mongodb://demo:123456@192.168.56.23:27017/demo
